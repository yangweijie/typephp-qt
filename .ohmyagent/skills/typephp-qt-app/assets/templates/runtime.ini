; Runtime ini for the embedded PHP runtime of a TypePHP desktop app.
; Point PHPRC at this file and clear PHP_INI_SCAN_DIR before launching.
;
; extension_dir points at the `ext` folder of the TypePHP package you built
; against. That path is build-machine specific, which is harmless while no
; extension is enabled below.
;
; To load a PHP extension, uncomment its line AND make the package ship it:
; copy the .dll out of the package's ext\ folder so it sits next to the
; executable (or into an ext\ folder with extension_dir pointed there), plus
; every DLL that extension depends on. php_pdo_sqlite.dll, for example, also
; needs libsqlite3.dll.
;
; package.bat's self-containment check fails the build if the packaged app
; reports a PHP startup problem, so a missing extension cannot slip through.
extension_dir=<PHP_HOME>/ext
; extension=php_pdo_sqlite.dll
