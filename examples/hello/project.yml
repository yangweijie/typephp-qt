name: hello
mode: bin
output: build/hello

# 桥接 C++ 源码直接参与本应用编译（源码内联方案）。
# 不依赖预编译的 qtphp-bridge.lib —— 那样会和 Qt/PHPX 版本强绑定。
#
# 本文件是「公共段 + Windows 默认段」：
#   - sources 用相对本文件的相对路径（tpc 按 project.yml 所在目录解析，两平台一致）
#   - Qt 位置/链接方式/编译开关是平台相关的，macOS 由 project.darwin.yml 覆盖
#     （qtphp build 按 PHP_OS_FAMILY 自动挑入口文件；Windows 仍直接用本文件，
#      build.bat 的 `tpc.exe project.yml` 不受影响）
sources:
  - src/main.php
  - ../../src/QtApp.php
  - ../../src/WidgetTree.php
  - ../../php-src/qt.stub.php
  - ../../cpp-src/qt_bridge.cc
  - ../../cpp-src/qt_widgets.cc
  - ../../cpp-src/qt_webview.cc
  # Windows nano：php-nano 缺 crc32 SIMD / Fiber CE / MSVC inline seed256 的目标文件
  - ../../compat/msvc/php_nano_win_stubs.c

build-dir: build

# 编译参数固化在这（直连 tpc 也吃这里，不再只靠 qtphp 的 CLI 默认）：
#   - cxx-std 必须是 c++17：nano 严格校验这一项，写 c++20 会被直接拒绝
#   - optimize: 2 即命令行 -O2；不写这项时直连 tpc 会按默认 -O0 编
cxx-std: c++17
optimize: 2

include-paths:
  - ../../cpp-src
  - ../../php-src
  - D:/tools/Qt/6.9.3/msvc2022_64/include
  - D:/tools/Qt/6.9.3/msvc2022_64/include/QtCore
  - D:/tools/Qt/6.9.3/msvc2022_64/include/QtGui
  - D:/tools/Qt/6.9.3/msvc2022_64/include/QtWidgets

link-paths:
  - ../../third_party/webview2/x64
  - D:/tools/Qt/6.9.3/msvc2022_64/lib

link-libs:
  - WebView2Loader.dll.lib
  - Qt6Core.lib
  - Qt6Gui.lib
  - Qt6Widgets.lib

cxx-flags:
  - /Zc:__cplusplus
  - /permissive-
  - /EHsc
  # WebView2 后端（完整 Chromium）。不定义 QT_WEBVIEW2 时会退化成
  # QTextBrowser（HTML 子集、不支持 JS），一样能编译运行。
  # 路径相对本文件：../../third_party/webview2 是仓库里 vendor 的 SDK。
  - /DQT_WEBVIEW2
  - /I"../../third_party/webview2/include"
